{% extends "base.html" %}
{% block title %}Redigera {{ member.full_name() }} · {{ site_name }}{% endblock %}
{% block content %}
<h1>Redigera {{ member.full_name() }}</h1>

<form method="post" novalidate class="card-box narrow">
  {{ form.hidden_tag() }}
  <label>{{ form.first_name.label }} {{ form.first_name() }}</label>
  <label>{{ form.last_name.label }} {{ form.last_name() }}</label>
  <label>{{ form.phone.label }} {{ form.phone() }}</label>
  <div class="button-row">
    {{ form.submit(class_="btn primary") }}
    <a class="btn" href="{{ url_for('admin.member_detail', member_id=member.id) }}">Avbryt</a>
  </div>
</form>
{% endblock %}
