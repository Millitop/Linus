# Example hostapd config for the Pi's own local Wi-Fi access point.
# Copy to /etc/hostapd/hostapd.conf and adjust ssid/wpa_passphrase.
# Referenced from /etc/default/hostapd via DAEMON_CONF.

interface=wlan0
driver=nl80211
ssid=Fritidsgard-Kort
hw_mode=g
channel=7
wmm_enabled=0
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0
wpa=2
wpa_passphrase=change-me-long-passphrase
wpa_key_mgmt=WPA-PSK
wpa_pairwise=TKIP
rsn_pairwise=CCMP
